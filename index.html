document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\n      <div style=\"position:absolute;left:0;top:0;width:56px;height:56px;border-left:3px solid #E94E1B;border-top:3px solid #E94E1B;\"><\u002Fdiv>\n      <div style=\"position:absolute;right:0;top:0;width:56px;height:56px;border-right:3px solid #E94E1B;border-top:3px solid #E94E1B;\"><\u002Fdiv>\n      <div style=\"position:absolute;left:0;bottom:0;width:56px;height:56px;border-left:3px solid #E94E1B;border-bottom:3px solid #E94E1B;\"><\u002Fdiv>\n      <div style=\"position:absolute;right:0;bottom:0;width:56px;height:56px;border-right:3px solid #E94E1B;border-bottom:3px solid #E94E1B;\"><\u002Fdiv>\n      <div style=\"font-family:Oxanium;font-weight:600;font-size:26px;letter-spacing:.32em;text-transform:uppercase;color:#E94E1B;\">Proposta Comercial<\u002Fdiv>\n      <h1 style=\"margin:28px 0 0;font-family:Oxanium;font-weight:800;font-size:104px;line-height:1.02;letter-spacing:-.01em;text-wrap:balance;\">Pacientes que chegam por <span style=\"color:#E94E1B;\">identificação<\u002Fspan>, não só por indicação.<\u002Fh1>\n    <\u002Fdiv>\n    <div style=\"margin-top:72px;padding-top:32px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;align-items:center;font-size:26px;\">\n      <span style=\"font-weight:600;\">Anna Marília Cabral <span style=\"color:#E94E1B;padding:0 14px;\">|<\u002Fspan> <span style=\"font-weight:300;color:rgba(255,255,255,.75);\">Psicologia Clínica<\u002Fspan><\u002Fspan>\n      <span style=\"font-weight:300;color:rgba(255,255,255,.6);\">Outubro de 2026<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Situação\" data-screen-label=\"02 Situação\" data-speaker-notes=\"Recapitular o que ela me contou, para mostrar que escutei. Sete anos de clínica e uma agenda cheia só por indicação é uma conquista real. A virada para o particular muda o jogo, e é daí que a gente parte.\" style=\"background:#0A0A0A;color:#FFFFFF;font-family:Manrope,sans-serif;overflow:hidden;\">\n  <div style=\  rgba(255,255,255,.25);display:flex;flex-direction:column;gap:16px;\"><div style=\"font-family:Oxanium;font-weight:700;font-size:56px;line-height:1.05;\">Agenda construída por indicação<\u002Fdiv><\u002Fdiv>\n      <div style=\"padding-top:36px;border-top:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;gap:16px;\"><div style=\"font-family:Oxanium;font-weight:700;font-size:56px;line-height:1.05;\">Foco total no particular<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Situação 2\" data-screen-label=\"03 Situação\" data-speaker-notes=\"Aqui é a ponte. No particular, o paciente pesquisa antes de marcar. Ele procura o nome dela, quer ver como ela pensa. Hoje ele não encontra nada, e isso não é culpa de ninguém, só ainda não foi construído.\" style=\"background:#121111;color:#FFFFFF;font-family:Manrope,sans-serif;overflow:hidden;\">\n  <div style=\"position:absolute;width:1300px;height:900px;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(233,78,27,.16),transparent 62%);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;opacity:.09;background-image:url(data:image/svg+xml;utf8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27240%27%20height=%27240%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.85%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url%28%23n%29%27/%3E%3C/svg%3E);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;padding:80px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;line-height:1;\"><span style=\"font-family:Oxanium;font-weight:800;font-size:32px;letter-spacing:.04em;\">FX <span style=\"color:#E94E1B;\">HUB<\u002Fspan><\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:14px;letter-spacing:.42em;color:rgba(255,255,255,.7);\">CREATIVE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:Oxanium;font-weight:600;font-size:24px;letter-spacing:.24em;color:#E94E1B;\">01 <span style=\"color:rgba(255,255,255,.55);padding-left:10px;\">SITUAÇÃO<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin:auto 0;display:flex;flex-direction:column;gap:56px;max-width:1500px;\">\n      <p style=\"margin:0;font-family:Oxanium;font-weight:700;font-size:88px;line-height:1.08;text-wrap:balance;\">A forma como você é vista fora do consultório agora pesa direto na sua <span style=\"color:#E94E1B;\">agenda.<\u002Fspan><\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:28px;\"><span style=\"font-family:Oxanium;font-weight:700;font-size:30px;color:#E94E1B;letter-spacing:.1em;\">&gt;&gt;&gt;<\u002Fspan><span style=\"font-size:34px;font-weight:300;color:rgba(255,255,255,.8);\">Hoje essa imagem ainda não existe de forma estruturada.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Problema\" data-screen-label=\"04 Problema\" data-speaker-notes=\"Três travas, uma de cada vez. Toda a entrada depende de indicação. Quem chega de fora não tem onde se reconhecer nela. E produzir conteúdo sozinha disputa tempo com a clínica, que é onde ela precisa estar.\" style=\"background:#0A0A0A;color:#FFFFFF;font-family:Manrope,sans-serif;overflow:hidden;\">\n  <div style=\"position:absolute;width:900px;height:900px;right:-380px;top:-400px;background:radial-gradient(circle,rgba(158,39,0,.32),transparent 65%);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;opacity:.09;background-image:url(data:image/svg+xml;utf8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27240%27%20height=%27240%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.85%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url%28%23n%29%27/%3E%3C/svg%3E);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;padding:80px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;line-height:1;\"><span style=\"font-family:Oxanium;font-weight:800;font-size:32px;letter-spacing:.04em;\">FX <span style=\"color:#E94E1B;\">HUB<\u002Fspan><\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:14px;letter-spacing:.42em;color:rgba(255,255,255,.7);\">CREATIVE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:Oxanium;font-weight:600;font-size:24px;letter-spacing:.24em;color:#E94E1B;\">02 <span style=\"color:rgba(255,255,255,.55);padding-left:10px;\">PROBLEMA<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"margin:150px 0 0;font-family:Oxanium;font-weight:800;font-size:88px;line-height:1.02;max-width:1300px;\">O que está travando o próximo passo<\u002Fh2>\n    <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;\">\n      <div style=\"padding:44px 44px 52px;background:#121111;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:56px;\"><span style=\"font-family:Oxanium;font-weight:800;font-size:64px;color:#E94E1B;line-height:1;\">A<\u002Fspan><span style=\"font-family:Oxanium;font-weight:700;font-size:44px;line-height:1.1;\">Um único canal de entrada<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:44px 44px 52px;background:#121111;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:56px;\"><span style=\"font-family:Oxanium;font-weight:800;font-size:64px;color:#E94E1B;line-height:1;\">B<\u002Fspan><span style=\"font-family:Oxanium;font-weight:700;font-size:44px;line-height:1.1;\">Sem ponto de identificação<\u002Fspan><\u002Fdiv>\n      <div style=\"padding:44px 44px 52px;background:#121111;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:56px;\"><span style=\"font-family:Oxanium;font-weight:800;font-size:64px;color:#E94E1B;line-height:1;\">C<\u002Fspan><span style=\"font-family:Oxanium;font-weight:700;font-size:44px;line-height:1.1;\">Produzir tira o foco da clínica<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Implicação\" data-screen-label=\"05 Implicação\" data-speaker-notes=\"Sem pressão, só realidade. Se a indicação desacelera, a agenda oscila. Quem pesquisa o nome dela não acha nada. Fica difícil sustentar um valor maior, e planos como grupos ou cursos ficam sem base.\" style=\"background:#121111;color:#FFFFFF;font-family:Manrope,sans-serif;overflow:hidden;\">\n  <div style=\"position:absolute;width:1000px;height:1000px;left:-420px;top:-300px;background:radial-gradient(circle,rgba(233,78,27,.18),transparent 65%);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;opacity:.09;background-image:url(data:image/svg+xml;utf8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27240%27%20height=%27240%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.85%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url%28%23n%29%27/%3E%3C/svg%3E);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;padding:80px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;line-height:1;\"><span style=\"font-family:Oxanium;font-weight:800;font-size:32px;letter-spacing:.04em;\">FX <span style=\"color:#E94E1B;\">HUB<\u002Fspan><\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:14px;letter-spacing:.42em;color:rgba(255,255,255,.7);\">CREATIVE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:Oxanium;font-weight:600;font-size:24px;letter-spacing:.24em;color:#E94E1B;\">03 <span style=\"color:rgba(255,255,255,.55);padding-left:10px;\">IMPLICAÇÃO<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;margin-bottom:auto;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:100px;align-items:center;\">\n      <h2 style=\"margin:0;font-family:Oxanium;font-weight:800;font-size:96px;line-height:1;\">O custo de deixar como está<\u002Fh2>\n      <div style=\"display:flex;flex-direction:column;\">\n        <div style=\"display:flex;align-items:center;gap:32px;padding:34px 0;border-top:1px solid rgba(255,255,255,.14);\"><span style=\"font-family:Oxanium;font-weight:700;font-size:30px;color:#E94E1B;letter-spacing:.08em;\">&gt;&gt;&gt;<\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:44px;\">Agenda sem previsibilidade<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:32px;padding:34px 0;border-top:1px solid rgba(255,255,255,.14);\"><span style=\"font-family:Oxanium;font-weight:700;font-size:30px;color:#E94E1B;letter-spacing:.08em;\">&gt;&gt;&gt;<\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:44px;\">Quem pesquisa, não encontra<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:32px;padding:34px 0;border-top:1px solid rgba(255,255,255,.14);\"><span style=\"font-family:Oxanium;font-weight:700;font-size:30px;color:#E94E1B;letter-spacing:.08em;\">&gt;&gt;&gt;<\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:44px;\">Valor percebido limitado<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:32px;padding:34px 0;border-top:1px solid rgba(255,255,255,.14);border-bottom:1px solid rgba(255,255,255,.14);\"><span style=\"font-family:Oxanium;font-weight:700;font-size:30px;color:#E94E1B;letter-spacing:.08em;\">&gt;&gt;&gt;<\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:44px;\">Projetos futuros sem base<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Virada\" data-screen-label=\"06 Virada\" data-speaker-notes=\"Pausa antes de falar. Deixar a frase respirar na tela. Reforçar que a indicação continua sendo valiosa; o que estamos propondo é um segundo caminho, que depende só dela.\" style=\"background:#0A0A0A;color:#FFFFFF;font-family:Manrope,sans-serif;overflow:hidden;\">\n  <div style=\"position:absolute;width:1400px;height:1000px;left:50%;top:55%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(233,78,27,.26) 0%,rgba(158,39,0,.14) 35%,transparent 65%);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;opacity:.09;background-image:url(data:image/svg+xml;utf8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27240%27%20height=%27240%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.85%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url%28%23n%29%27/%3E%3C/svg%3E);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;padding:80px 110px;display:flex;flex-direction:column;align-items:center;justify-content:center;\">\n    <div style=\"position:relative;padding:90px 110px;max-width:1500px;display:flex;flex-direction:column;gap:48px;\">\n      <div style=\"position:absolute;left:0;top:0;width:64px;height:64px;border-left:3px solid #E94E1B;border-top:3px solid #E94E1B;\"><\u002Fdiv>\n      <div style=\"position:absolute;right:0;top:0;width:64px;height:64px;border-right:3px solid #E94E1B;border-top:3px solid #E94E1B;\"><\u002Fdiv>\n      <div style=\"position:absolute;left:0;bottom:0;width:64px;height:64px;border-left:3px solid #E94E1B;border-bottom:3px solid #E94E1B;\"><\u002Fdiv>\n      <div style=\"position:absolute;right:0;bottom:0;width:64px;height:64px;border-right:3px solid #E94E1B;border-bottom:3px solid #E94E1B ng:.42em;color:rgba(255,255,255,.7);\">CREATIVE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:Oxanium;font-weight:600;font-size:24px;letter-spacing:.24em;color:#E94E1B;\">04 <span style=\"color:rgba(255,255,255,.55);padding-left:10px;\">GANHO<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"margin:80px 0 0;font-family:Oxanium;font-weight:800;font-size:80px;line-height:1;\">O que muda com a estrutura certa<\u002Fh2>\n    <div style=\"margin-top:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;background:rgba(255,255,255,.1);\">\n      <div style=\"background:#121111;padding:44px 48px 44px 0;display:flex;flex-direction:column;gap:14px;\"><span style=\"font-family:Oxanium;font-weight:700;font-size:48px;color:#E94E1B;\">Previsibilidade<\u002Fspan><span style=\"font-size:30px;font-weight:400;color:rgba(255,255,255,.85);\">Um segundo canal de entrada<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#121111;padding:44px 0 44px 56px;display:flex;flex-direction:column;gap:14px;\"><span style=\"font-family:Oxanium;font-weight:700;font-size:48px;color:#E94E1B;\">Filtro natural<\u002Fspan><span style=\"font-size:30px;font-weight:400;color:rgba(255,255,255,.85);\">Pacientes mais alinhados<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#121111;padding:44px 48px 44px 0;display:flex;flex-direction:column;gap:14px;\"><span style=\"font-family:Oxanium;font-weight:700;font-size:48px;color:#E94E1B;\">Foco preservado<\u002Fspan><span style=\"font-size:30px;font-weight:400;color:rgba(255,255,255,.85);\">Você na clínica, nós na execução<\u002Fspan><\u002Fdiv>\n      <div style=\"background:#121111;padding:44px 0 44px 56px;display:flex;flex-direction:column;gap:14px;\"><span style=\"font-family:Oxanium;font-weight:700;font-size:48px;color:#E94E1B;\">Valor percebido<\u002Fspan><span style=\"font-size:30px;font-weight:400;color:rgba(255,255,255,.85);\">Base para crescer o ticket<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Estratégia\" data-screen-label=\"08 Estratégia\" data-speaker-notes=\"Explicar a lógica em três tempos. Primeiro definir quem ela quer atender e o que defende, sempre dentro do código de ética do CRP. Depois a narrativa, falando com o paciente. Por fim a presença, com os canais conectados.\" style=\"background:#0A0A0A;color:#FFFFFF;font-family:Manrope,sans-serif;overflow:hidden;\">\n  <div style=\"position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:120px 120px;\"><\u002Fdiv>\n  <div style=\"position:absolute;width:1100px;height:800px;left:50%;top:70%;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(158,39,0,.3),transparent 65%);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;opacity:.09;background-image:url(data:image/svg+xml;utf8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27240%27%20height=%27240%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.85%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url%28%23n%29%27/%3E%3C/svg%3E);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;padding:80px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;line-height:1;\"><span style=\"font-family:Oxanium;font-weight:800;font-size:32px;letter-spacing:.04em;\">FX <span style=\"color:#E94E1B;\">HUB<\u002Fspan><\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:14px;letter-spacing:.42em;color:rgba(255,255,255,.7);\">CREATIVE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:Oxanium;font-weight:600;font-size:24px;letter-spacing:.24em;color:#E94E1B;\">05 <span style=\"color:rgba(255,255,255,.55);padding-left:10px;\">ESTRATÉGIA<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <h2 style=\"margin:120px 0 0;font-family:Oxanium;font-weight:800;font-size:96px;line-height:1;\">Como vamos construir<\u002Fh2>\n    <div style=\"margin-top:auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto minmax(0,1fr);gap:40px;align-items:start;\">\n      <div style=\"display:flex;flex-direction:column;gap:24px;\"><span style=\"font-family:Oxanium;font-weight:600;font-size:24px;color:#E94E1B;letter-spacing:.2em;\">ETAPA 1<\u002Fspan><span style=\"font-family:Oxanium;font-weight:800;font-size:54px;line-height:1;\">Posicionamento<\u002Fspan><span style=\"font-size:28px;line-height:1.4;font-weight:400;color:rgba(255,255,255,.8);text-wrap:pretty;\">Quem atender e o que defender, dentro do CRP<\u002Fspan><\u002Fdiv>\n      <span style=\"font-family:Oxanium;font-weight:700;font-size:40px;color:#E94E1B;padding-top:64px;letter-spacing:.06em;\">&gt;&gt;&gt;<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:24px;\"><span style=\"font-family:Oxanium;font-weight:600;font-size:24px;color:#E94E1B;letter-spacing:.2em;\">ETAPA 2<\u002Fspan><span style=\"font-family:Oxanium;font-weight:800;font-size:54px;line-height:1;\">Narrativa<\u002Fspan><span style=\"font-size:28px;line-height:1.4;font-weight:400;color:rgba(255,255,255,.8);text-wrap:pretty;\">Roteiros que falam com o paciente, não com colegas<\u002Fspan><\u002Fdiv>\n      <span style=\"font-family:Oxanium;font-weight:700;font-size:40px;color:#E94E1B;padding-top:64px;letter-spacing:.06em;\">&gt;&gt;&gt;<\u002Fspan>\n      <div style=\"display:flex;flex-direction:column;gap:24px;\"><span style=\"font-family:Oxanium;font-weight:600;font-size:24px;color:#E94E1B;letter-spacing:.2em;\">ETAPA 3<\u002Fspan><span style=\"font-family:Oxanium;font-weight:800;font-size:54px;line-height:1;\">Presença<\u002Fspan><span style=\"font-size:28px;line-height:1.4;font-weight:400;color:rgba(255,255,255,.8);text-wrap:pretty;\">Instagram, site e Google trabalhando juntos<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section data-label=\"Plano 01\" data-screen-label=\"09 Plano 01\" data-speaker-notes=\"Plano de entrada. Ideal se ela quiser gravar por conta própria, mas com direção clara. A gente entrega estratégia, roteiros e acompanhamento, e ela executa no ritmo dela.\" style=\"background:#121111;color:#FFFFFF;font-family:Manrope,sans-serif;overflow:hidden;\">\n  <div style=\"position:absolute;width:900px;height:900px;right:-380px;top:-360px;background:radial-gradient(circle,rgba(233,78,27,.16),transparent 65%);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;opacity:.09;background-image:url(data:image/svg+xml;utf8,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27240%27%20height=%27240%27%3E%3Cfilter%20id=%27n%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%27.85%27%20numOctaves=%273%27%20stitchTiles=%27stitch%27/%3E%3C/filter%3E%3Crect%20width=%27100%25%27%20height=%27100%25%27%20filter=%27url%28%23n%29%27/%3E%3C/svg%3E);\"><\u002Fdiv>\n  <div style=\"position:absolute;inset:0;padding:80px 110px;display:flex;flex-direction:column;\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;\">\n      <div style=\"display:flex;flex-direction:column;gap:6px;line-height:1;\"><span style=\"font-family:Oxanium;font-weight:800;font-size:32px;letter-spacing:.04em;\">FX <span style=\"color:#E94E1B;\">HUB<\u002Fspan><\u002Fspan><span style=\"font-family:Oxanium;font-weight:600;font-size:14px;letter-spacing:.42em;color:rgba(255,255,255,.7);\">CREATIVE<\u002Fspan><\u002Fdiv>\n      <div style=\"font-family:Oxanium;font-weight:600;font-size:24px;letter-spacing:.24em;color:#E94E1B;\">06 <span style=\"color:rgba(255,255,255,.55);padding-left:10px;\">ESCOPO<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;margin-bottom:auto;display:grid;grid-template-columns:minmax(0,.95fr
